<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Later</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;--border:#2a2a30;
  --accent:#e8ff47;--text:#f0f0f2;--muted:#8888a0;--muted2:#7878a0;--r:10px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{padding:28px 24px 0;max-width:1440px;margin:0 auto}
.header-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:'Syne',sans-serif;font-size:clamp(26px,5vw,50px);font-weight:800;letter-spacing:-1.5px;line-height:1}
.badge{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;background:var(--accent);color:#0e0e10;padding:3px 10px;border-radius:999px;align-self:center}

/* CONTROLS */
.controls{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
input[type=search]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px 9px 34px;outline:none;transition:border-color .15s}
input[type=search]:focus{border-color:var(--accent)}
input[type=search]::placeholder{color:var(--muted2)}
.sel-wrap{position:relative}
.sel-wrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:11px}
select{appearance:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 32px 9px 13px;outline:none;cursor:pointer;transition:border-color .15s;min-width:190px}
select:focus{border-color:var(--accent)}
select option{background:#1f1f24}
.rcount{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.rcount span{color:var(--text);font-weight:500}

/* ACTIVE FILTER PILL */
.af{display:none;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.af.on{display:flex}
.pill{display:flex;align-items:center;gap:5px;background:var(--accent);color:#0e0e10;font-weight:700;font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.02em}
.pill:hover{opacity:.8}

/* GRID */
.grid-wrap{max-width:1440px;margin:20px auto 60px;padding:0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* CARD */
a.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .18s,border-color .18s;cursor:pointer}
a.card:hover{transform:translateY(-3px);border-color:#3a3a48}
a.card:hover .ov{opacity:1}
a.card:hover .thumb img{transform:scale(1.04)}

.thumb{position:relative;aspect-ratio:16/9;background:var(--surface2);overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s}
.play{width:42px;height:42px;background:rgba(232,255,71,.9);border-radius:50%;display:flex;align-items:center;justify-content:center}
.play svg{width:15px;height:15px;fill:#0e0e10;margin-left:2px}
.no-thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:26px}

.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.title{font-size:12px;font-weight:500;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px;padding-top:4px}
.chan{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0;letter-spacing:.02em;cursor:pointer;transition:opacity .15s}
.tag:hover{opacity:.75}

/* EMPTY */
.empty{display:none;text-align:center;padding:80px 24px;color:var(--muted)}
.empty.on{display:block}
.empty h2{font-family:'Syne',sans-serif;font-size:22px;color:var(--text);margin-bottom:6px}

/* LOAD MORE */
.lm{text-align:center;margin-top:20px;display:none}
.lm.on{display:block}
.lm-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:11px 30px;cursor:pointer;transition:border-color .15s,color .15s;letter-spacing:.02em}
.lm-btn:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:600px){
  header{padding:18px 16px 0}
  .grid-wrap{padding:0 14px;margin-top:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
  .controls{gap:7px}
  .search-wrap{max-width:100%}
}

/* CONTEXT MENU */
.ctx{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;min-width:170px;z-index:1000;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-btn{width:100%;background:none;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:11px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.ctx-btn:hover{background:rgba(255,255,255,.06)}
.ctx-btn svg{flex-shrink:0;opacity:.7}
.ctx-btn.danger:hover{background:rgba(255,80,80,.12);color:#ff6b6b}
.ctx-btn.danger:hover svg{opacity:1}
.ctx-btn.watched-btn:hover{background:rgba(100,220,130,.1);color:#6ddc8a}
.ctx-btn.watched-btn:hover svg{opacity:1}

/* WATCHED OVERLAY */
.card.is-watched .thumb::after{content:'✓ Watched';position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#6ddc8a;letter-spacing:.05em}
.card.is-watched{opacity:.55}
.card.is-watched:hover{opacity:.75}


/* BATCH SELECT */
.batch-bar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:200}
.batch-bar.on{display:flex}
.batch-count{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent)}
.batch-btn{background:none;border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;letter-spacing:.02em}
.batch-btn:hover{border-color:var(--accent);color:var(--accent)}
.batch-btn.danger:hover{border-color:#ff6b6b;color:#ff6b6b}
.batch-btn.cancel{color:var(--muted)}
.batch-btn.select-all{color:var(--muted)}
.batch-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.card.selecting{cursor:pointer}
.card.selecting:hover{border-color:var(--accent)}
.card.batch-selected{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.card.batch-selected .thumb::after{content:'✓';position:absolute;top:8px;right:8px;width:22px;height:22px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0e0e10;line-height:22px;text-align:center}

</style>
</head>

<header>
  <div class="header-row" style="justify-content:space-between;align-items:center;width:100%">
    <h1>Watch Later</h1>
    <span class="badge" id="totalBadge">890</span>
    <div style="position:relative" id="importWrap">

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 14 12 9 17 14"/><line x1="12" y1="9" x2="12" y2="21"/></svg>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Download CSV
        </button>
        <button onclick="exportData('json')" style="width:100%;background:none;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:11px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .12s" onmouseenter="this.style.background='rgba(255,255,255,.05)'" onmouseleave="this.style.background='none'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Download JSON
        </button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="search" id="q" placeholder="Search titles, channels…" autocomplete="off">
    </div>
    <div class="sel-wrap">
      <select id="catSel"><option value="">All categories</option></select>
    </div>
    <div class="sel-wrap">
      <select id="statusSel">
        <option value="unwatched">Not watched</option>
        <option value="watched">Watched</option>
        <option value="all">Everything</option>
      </select>
    </div>
    <div class="rcount" id="rc"></div>
  </div>
  <div class="af" id="af">
    Filtered by:
    <span class="pill" id="pill" onclick="clearCat()">
      <span id="pillLabel"></span><span>×</span>
    </span>
  </div>

</header>

<div class="batch-bar" id="batchBar">
  <span class="batch-count" id="batchCount">0 selected</span>
  <div class="batch-sep"></div>
  <button class="batch-btn select-all" onclick="batchSelectAll()">Select all</button>
  <button class="batch-btn" onclick="batchMarkWatched()">Mark as watched</button>
  <button class="batch-btn danger" onclick="batchRemove()">Remove</button>
  <div class="batch-sep"></div>
  <button class="batch-btn cancel" onclick="exitBatchMode()">× Cancel</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><h2>No videos found</h2><p>Try a different search or category</p></div>
  <div class="lm" id="lm"><button class="lm-btn" onclick="loadMore()">Load more</button></div>
</div>

const PAGE = 60;

// ── STATE ──────────────────────────────────────────────────────────────────
function loadState() {
  try { return JSON.parse(localStorage.getItem('wl_state') || '{}'); } catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem('wl_state', JSON.stringify(s)); } catch {}
}

// state: { [id]: 'watched' | 'removed' }
let state = loadState();

function getVideos() {
  return VIDEOS_RAW.map(v => ({...v, status: state[v.id] || 'unwatched'}))
                   .filter(v => v.status !== 'removed');
}

let cat = '', q = '', statusFilter = 'unwatched', page = 1, filtered = [];

// ── POPULATE SELECTS ───────────────────────────────────────────────────────
const catSel = document.getElementById('catSel');
CATS.forEach(c => {
  const o = document.createElement('option');
  o.value = o.textContent = c;
  catSel.appendChild(o);
});

// ── THUMBNAIL ──────────────────────────────────────────────────────────────
function thumb(id) { return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; }

function tagStyle(c) {
  const [bg, fg] = COLORS[c] || ['#333','#fff'];
  return `background:${bg};color:${fg}`;
}

// ── CARD ───────────────────────────────────────────────────────────────────
function makeCard(v) {
  const a = document.createElement('a');
  a.className = 'card' + (v.status === 'watched' ? ' is-watched' : '');
  a.href = v.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.dataset.id = v.id;

  a.innerHTML = `
    <div class="thumb">
      <img src="${thumb(v.id)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-thumb>▶</div>'">
      <div class="ov"><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
    </div>
    <div class="body">
      <div class="title">${v.title.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <div class="meta">
        <span class="chan">${(v.channel||'').replace(/</g,'&lt;')}</span>
        ${!cat ? `<span class="tag" style="${tagStyle(v.category)}" onclick="filterByCat(event,'${v.category.replace(/'/g,"\'")}')">${v.category}</span>` : ''}
      </div>
    </div>`;

  // Long press → enter batch mode and select this card
  let pressTimer;
  let longPressed = false;
  const startPress = (e) => {
    longPressed = false;
    pressTimer = setTimeout(() => {
      longPressed = true;
      if (!batchMode) enterBatchMode();
      toggleCardSelect(a, v.id);
    }, 500);
  };
  const cancelPress = () => clearTimeout(pressTimer);

  a.addEventListener('mousedown', e => { if (e.button === 0) startPress(e); });
  a.addEventListener('touchstart', startPress, {passive: true});
  a.addEventListener('mouseup', cancelPress);
  a.addEventListener('mouseleave', cancelPress);
  a.addEventListener('touchend', cancelPress);
  a.addEventListener('touchmove', cancelPress);
  a.addEventListener('contextmenu', e => {
    e.preventDefault();
    // Only handle right-click on desktop (not the synthetic contextmenu from mobile long press)
    if (e.pointerType === 'touch' || longPressed) return;
    if (!batchMode) enterBatchMode();
    toggleCardSelect(a, v.id);
  });

  // Click: in batch mode toggle selection; otherwise navigate
  a.addEventListener('click', e => {
    if (longPressed) { e.preventDefault(); e.stopPropagation(); longPressed = false; return; }
    if (batchMode) { e.preventDefault(); e.stopPropagation(); toggleCardSelect(a, v.id); }
  });
  a.addEventListener('mousedown', e => { if (batchMode) e.preventDefault(); });

  return a;
}

// ── KEYBOARD ESC to exit batch ────────────────────────────────────────────
document.addEventListener('keydown', e => { if (e.key === 'Escape' && batchMode) exitBatchMode(); });

// ── FILTER & RENDER ────────────────────────────────────────────────────────
function filterByCat(e, c) {
  e.preventDefault(); e.stopPropagation();
  cat = c; catSel.value = c; page = 1; render();
}
function clearCat() {
  cat = ''; catSel.value = ''; page = 1; render();
}

function render() {
  const videos = getVideos();
  const qLower = q.toLowerCase();

  filtered = videos.filter(v => {
    const matchCat = !cat || v.category === cat;
    const matchQ = !q || v.title.toLowerCase().includes(qLower) || (v.channel||'').toLowerCase().includes(qLower);
    const matchStatus = statusFilter === 'all' || v.status === statusFilter;
    return matchCat && matchQ && matchStatus;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const slice = filtered.slice(0, page * PAGE);
  const frag = document.createDocumentFragment();
  slice.forEach(v => frag.appendChild(makeCard(v)));
  grid.appendChild(frag);

  document.getElementById('empty').classList.toggle('on', filtered.length === 0);
  document.getElementById('lm').classList.toggle('on', filtered.length > page * PAGE);

  const total = VIDEOS_RAW.filter(v => state[v.id] !== 'removed').length;
  document.getElementById('totalBadge').textContent = total;

  const rc = document.getElementById('rc');
  rc.innerHTML = filtered.length < total
    ? `<span>${filtered.length}</span> of ${total}`
    : `<span>${total}</span> videos`;

  const af = document.getElementById('af');
  af.classList.toggle('on', !!cat);
  if (cat) document.getElementById('pillLabel').textContent = cat;
}

function loadMore() { page++; render(); }

document.getElementById('q').addEventListener('input', e => {
  q = e.target.value.trim(); page = 1; render();
});
document.getElementById('catSel').addEventListener('change', e => {
  cat = e.target.value; page = 1; render();
});
document.getElementById('statusSel').addEventListener('change', e => {
  statusFilter = e.target.value; page = 1; render();
});

// ── EXPORT ─────────────────────────────────────────────────────────────────
function toggleExport() {
  const m = document.getElementById('exportMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('click', e => {
  if (!document.getElementById('exportWrap').contains(e.target)) {
    document.getElementById('exportMenu').style.display = 'none';
  }
});

function exportData(format) {
  document.getElementById('exportMenu').style.display = 'none';
  // Export: all non-removed videos, with their current status
  const data = getVideos().map(({status, ...v}) => ({...v, watched: status === 'watched'}));
  const label = `watch_later_${new Date().toISOString().slice(0,10)}`;

  if (format === 'json') {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    download(blob, label + '.json');
  } else {
    const header = ['id','title','channel','category','watched','url'];
    const rows = data.map(v =>
      header.map(k => `"${String(v[k] ?? '').replace(/"/g,'""')}"`).join(',')
    );
    const csv = [header.join(','), ...rows].join('\n');
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    download(blob, label + '.csv');
  }
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

render();

// ── IMPORT ─────────────────────────────────────────────────────────────────
let pendingImportState = null;

function triggerImport() {
  document.getElementById('importFile').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = ''; // reset so same file can be re-imported

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      if (file.name.endsWith('.json')) {
        parseImportJSON(ev.target.result);
      } else {
        parseImportCSV(ev.target.result);
      }
    } catch(err) {
      showToast('Could not parse file: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

function parseImportJSON(text) {
  const data = JSON.parse(text);

  // Accept two formats:
  // 1. Array of video objects (our export format) with optional "watched" field
  // 2. Raw state object { id: 'watched'|'removed' }
  let newState = {};

  if (Array.isArray(data)) {
    // Export format — reconstruct state from watched/removed flags
    // First mark everything in the array as known
    const exportedIds = new Set(data.map(v => v.id));
    // Videos in VIDEOS_RAW that are NOT in the export were removed
    VIDEOS_RAW.forEach(v => {
      if (!exportedIds.has(v.id)) newState[v.id] = 'removed';
    });
    // Videos in export with watched:true
    data.forEach(v => {
      if (v.watched === true) newState[v.id] = 'watched';
    });
  } else if (typeof data === 'object' && data !== null) {
    // Raw state object
    newState = data;
  } else {
    throw new Error('Unrecognised format');
  }

  showImportConfirm(newState);
}

function parseImportCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) throw new Error('File appears empty');

  const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
  const idIdx      = headers.indexOf('id');
  const watchedIdx = headers.indexOf('watched');
  if (idIdx === -1) throw new Error('No "id" column found');

  const exportedIds = new Set();
  const newState = {};

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].match(/(".*?"|[^,]+)(?=,|$)/g) || [];
    const id = (cols[idIdx] || '').replace(/"/g, '').trim();
    if (!id) continue;
    exportedIds.add(id);
    if (watchedIdx !== -1) {
      const watched = (cols[watchedIdx] || '').replace(/"/g, '').trim();
      if (watched === 'true' || watched === '1') newState[id] = 'watched';
    }
  }

  // Videos not in export were removed
  VIDEOS_RAW.forEach(v => {
    if (!exportedIds.has(v.id)) newState[v.id] = 'removed';
  });

  showImportConfirm(newState);
}

function showImportConfirm(newState) {
  pendingImportState = newState;
  const removed  = Object.values(newState).filter(s => s === 'removed').length;
  const watched  = Object.values(newState).filter(s => s === 'watched').length;
  document.getElementById('importSummary').textContent =
    `This will set ${watched} video${watched !== 1 ? 's' : ''} as watched and ${removed} as removed. Your current state will be replaced.`;
  document.getElementById('importConfirm').style.display = 'flex';
}

function cancelImport() {
  pendingImportState = null;
  document.getElementById('importConfirm').style.display = 'none';
}

function confirmImport() {
  if (!pendingImportState) return;
  state = pendingImportState;
  saveState(state);
  pendingImportState = null;
  document.getElementById('importConfirm').style.display = 'none';
  page = 1;
  render();
  showToast('State imported successfully');
}

function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  const msgEl = document.getElementById('toastMsg');
  msgEl.textContent = msg;
  el.style.display = 'flex';
  el.style.borderColor = isError ? '#ff6b6b' : 'var(--border)';
  el.style.opacity = '1';
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; }, 200);
  }, 3000);
}


// ── BATCH SELECT ──────────────────────────────────────────────────────────
let batchMode = false;
let batchSelected = new Set();

function enterBatchMode() {
  batchMode = true;
  batchSelected.clear();
  document.getElementById('batchBar').classList.add('on');
  updateBatchCount();
}

function exitBatchMode() {
  batchMode = false;
  batchSelected.clear();
  document.getElementById('batchBar').classList.remove('on');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('batch-selected'));
}

function toggleCardSelect(card, id) {
  if (batchSelected.has(id)) {
    batchSelected.delete(id);
    card.classList.remove('batch-selected');
  } else {
    batchSelected.add(id);
    card.classList.add('batch-selected');
  }
  updateBatchCount();
}

function updateBatchCount() {
  const n = batchSelected.size;
  document.getElementById('batchCount').textContent = n === 0 ? 'None selected' : `${n} selected`;
}

function batchSelectAll() {
  const cards = document.querySelectorAll('.card');
  const allSelected = [...cards].every(c => batchSelected.has(c.dataset.id));
  if (allSelected) {
    batchSelected.clear();
    cards.forEach(c => c.classList.remove('batch-selected'));
  } else {
    cards.forEach(c => { batchSelected.add(c.dataset.id); c.classList.add('batch-selected'); });
  }
  updateBatchCount();
}

function batchMarkWatched() {
  if (batchSelected.size === 0) return;
  batchSelected.forEach(id => { state[id] = state[id] === 'watched' ? 'unwatched' : 'watched'; });
  saveState(state);
  const n = batchSelected.size;
  exitBatchMode(); page = 1; render();
  showToast(`${n} video${n !== 1 ? 's' : ''} toggled watched`);
}

function batchRemove() {
  if (batchSelected.size === 0) return;
  batchSelected.forEach(id => { state[id] = 'removed'; });
  saveState(state);
  const n = batchSelected.size;
  exitBatchMode(); page = 1; render();
  showToast(`${n} video${n !== 1 ? 's' : ''} removed`);
}

</script>


<div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:12px 20px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .2s;pointer-events:none">
  <span id="toastMsg"></span>
</div>
<div id="importConfirm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;align-items:center;justify-content:center">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;max-width:400px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.6)">
    <h3 style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)">Import state</h3>
    <p id="importSummary" style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="cancelImport()" style="background:none;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:8px 16px;cursor:pointer">Cancel</button>
      <button onclick="confirmImport()" style="background:var(--accent);border:none;border-radius:var(--r);color:#0e0e10;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:8px 16px;cursor:pointer">Apply</button>
    </div>
  </div>
</div>

</body>
</html>
